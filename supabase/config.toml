# Katoa Supabase local config — used by `supabase link` + `supabase db push`
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "pglqjtipbocjnqmiwmwf"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/dashboard", "https://katoa.org/dashboard"]

# BTCPay posts with HMAC (BTCPay-Sig), not a Supabase JWT.
[functions.btcpay-webhook]
verify_jwt = false