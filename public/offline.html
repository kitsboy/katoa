<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050509" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <title>Offline — KATOA</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, sans-serif;
        background: #050509;
        color: #e5e7eb;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      }
      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        padding: 2rem 1.5rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      img { width: 4rem; height: 4rem; border-radius: 1rem; margin-bottom: 1.25rem; object-fit: contain; }
      h1 { font-size: 1.35rem; margin-bottom: 0.75rem; font-weight: 800; }
      p { color: #9ca3af; line-height: 1.6; margin-bottom: 1rem; font-size: 0.95rem; }
      .trust { font-size: 0.7rem; color: #6b7280; margin-bottom: 1.5rem; letter-spacing: 0.02em; }
      .actions { display: flex; flex-direction: column; gap: 0.75rem; align-items: stretch; }
      a, button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        background: #14e6ff;
        color: #050509;
        font-weight: 700;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-size: 0.95rem;
      }
      a.secondary {
        background: transparent;
        color: #e5e7eb;
        border: 1px solid rgba(255,255,255,0.15);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo2.png" width="64" height="64" alt="KATOA" />
      <h1>You're offline</h1>
      <p>
        KATOA needs a connection for live wishlists and Lightning. Cached pages may still work.
        Your sats stay in <strong>your</strong> wallet — we never hold them.
      </p>
      <p class="trust">0% platform fees · non-custodial · open source</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Go home</a>
        <a class="secondary" href="/offline.html">Stay on this page</a>
      </div>
    </div>
  </body>
</html>
