name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Smoke — dist has NIP-05 + version
        run: |
          test -f dist/.well-known/nostr.json
          test -f dist/version.json
          grep -q '"names"' dist/.well-known/nostr.json
          node -e "JSON.parse(require('fs').readFileSync('dist/.well-known/nostr.json','utf8'))"
