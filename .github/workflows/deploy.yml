name: Deploy katoa to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Deploy to CF Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy ./dist --project-name=katoa --branch=main
      - name: Verify assets are not HTML (Origin-keyed poison check)
        run: |
          set -euo pipefail
          sleep 8
          HTML=$(curl -fsSL "https://katoa.org/")
          CSS=$(echo "$HTML" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.css' | head -1)
          JS=$(echo "$HTML" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "CSS=$CSS JS=$JS"
          test -n "$CSS" && test -n "$JS"
          for path in "$CSS" "$JS"; do
            body=$(curl -fsSL -H 'Origin: https://katoa.org' -H 'Referer: https://katoa.org/' "https://katoa.org$path" | head -c 32)
            echo "$path -> ${body}"
            case "$body" in
              '<!'*|'<html'*|'<!doctype'*|'<!DOCTYPE'*)
                echo "::error::Asset $path returned HTML under Origin (cache poison)"
                exit 1
                ;;
            esac
          done
          echo "Asset Origin check OK"
