name: Deploy katoa to Cloudflare Pages

# ONE deployer: the Cloudflare Pages <-> GitHub integration builds and publishes every push to main.
# The duplicate `wrangler pages deploy` step and this repo's CLOUDFLARE_API_TOKEN secret were
# retired 2026-09-11 (see HQ docs/CLOUDFLARE-TOKEN-RETIREMENT.md).
# What is left: build the commit here (early red signal) and verify production is live — no credential.
# Break-glass (manual ONLY, never on push): Run workflow -> mode = break-glass-deploy, which needs the
# repo secret CLOUDFLARE_PAGES_TOKEN (Pages:Edit, created in the Cloudflare dashboard).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "verify = check production is live (no token); break-glass-deploy = manual wrangler fallback"
        type: choice
        options:
          - verify
          - break-glass-deploy
        default: verify

jobs:
  build_and_verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Build
        env:
          # Unique footer version every deploy (vX.Y.Z+run.N)
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run version:bump && npm run build
      - name: Verify live deploy + assets are not HTML (CF git integration)
        run: |
          set -euo pipefail
          # CF edge propagation can lag briefly after the git-integration build finishes
          ok=0
          for attempt in $(seq 1 24); do
            sleep 10
            HTML=$(curl -fsSL "https://katoa.org/" || true)
            printf '%s' "$HTML" > /tmp/prod-page.html
            grep -q "Katoa" /tmp/prod-page.html || { echo "attempt=$attempt: not live yet"; continue; }
            CSS=$(echo "$HTML" | grep -oE '/assets/index-[A-Za-z0-9_.-]+\.css' | head -1 || true)
            JS=$(echo "$HTML" | grep -oE '/assets/index-[A-Za-z0-9_.-]+\.js' | head -1 || true)
            echo "attempt=$attempt CSS=$CSS JS=$JS"
            if [ -z "$CSS" ] || [ -z "$JS" ]; then
              echo "missing asset refs; retry"
              continue
            fi
            bad=0
            for path in "$CSS" "$JS"; do
              body=$(curl -fsSL -H 'Origin: https://katoa.org' -H 'Referer: https://katoa.org/' "https://katoa.org$path" | head -c 64 || true)
              echo "$path -> ${body}"
              case "$body" in
                '<!'*|'<html'*|'<!doctype'*|'<!DOCTYPE'*)
                  echo "still HTML; retry"
                  bad=1
                  ;;
                '')
                  echo "empty body; retry"
                  bad=1
                  ;;
              esac
            done
            if [ "$bad" -eq 0 ]; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Live/asset Origin check failed after retries for $GITHUB_SHA"
            exit 1
          fi
          echo "Live + asset Origin check OK"

  # Manual fallback only — cannot race the git integration because it never runs on push.
  break_glass_deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'break-glass-deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run version:bump && npm run build
      - name: Require scoped Pages token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::repo secret CLOUDFLARE_PAGES_TOKEN is not set — create a Pages:Edit token in the Cloudflare dashboard and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Scoped Pages token present (value never logged)."
      - name: Deploy to CF Pages (break-glass, manual only)
        run: npx --yes wrangler@4 pages deploy ./dist --project-name=katoa --branch=main
