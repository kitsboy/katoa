name: Deploy katoa to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Build
        env:
          # Unique footer version every deploy (vX.Y.Z+run.N)
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run version:bump && npm run build
      - name: Deploy to CF Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy ./dist --project-name=katoa --branch=main
      - name: Verify assets are not HTML (Origin-keyed poison check)
        run: |
          set -euo pipefail
          # CF edge propagation can lag briefly after pages deploy
          ok=0
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            HTML=$(curl -fsSL "https://katoa.org/" || true)
            CSS=$(echo "$HTML" | grep -oE '/assets/index-[A-Za-z0-9_.-]+\.css' | head -1 || true)
            JS=$(echo "$HTML" | grep -oE '/assets/index-[A-Za-z0-9_.-]+\.js' | head -1 || true)
            echo "attempt=$attempt CSS=$CSS JS=$JS"
            if [ -z "$CSS" ] || [ -z "$JS" ]; then
              echo "missing asset refs; retry"
              continue
            fi
            bad=0
            for path in "$CSS" "$JS"; do
              body=$(curl -fsSL -H 'Origin: https://katoa.org' -H 'Referer: https://katoa.org/' "https://katoa.org$path" | head -c 64 || true)
              echo "$path -> ${body}"
              case "$body" in
                '<!'*|'<html'*|'<!doctype'*|'<!DOCTYPE'*)
                  echo "still HTML; retry"
                  bad=1
                  ;;
                '')
                  echo "empty body; retry"
                  bad=1
                  ;;
              esac
            done
            if [ "$bad" -eq 0 ]; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Asset Origin check failed after retries (cache poison?)"
            exit 1
          fi
          echo "Asset Origin check OK"
